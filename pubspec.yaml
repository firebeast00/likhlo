name: student_expense_manager
description: A complete expense tracker for students developed by Jawad Ahmed.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  intl: ^0.19.0
  uuid: ^4.3.3
  printing: ^5.12.0
  pdf: ^3.10.8
  path_provider: ^2.1.2
  fl_chart: ^0.66.2
  flutter_local_notifications: ^17.1.0 # Ensure this is up to date
  timezone: ^0.9.2
  cupertino_icons: ^1.0.2


  # 👇 NEW PACKAGES
  file_picker: ^8.0.0
  permission_handler: ^11.3.0
  speech_to_text: ^7.4.0
  google_mlkit_text_recognition: ^0.16.0
  image_picker: ^1.1.2
  quick_actions: ^1.1.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  build_runner: ^2.4.8
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.13.1 # Add this line
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true


  assets:
    - assets/app_logo.png
    - assets/logo2.png

  # Correct Indentation for Assets
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/app_logo.png"
  min_sdk_android: 21 # Required for newer Android versions
  adaptive_icon_background: "#1E3A8A" # Optional: Matches your deep blue splash theme
  adaptive_icon_foreground: "assets/app_logo.png"


flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/app_logo.png"

  color_dark: "#0F172A"
  image_dark: "assets/app_logo.png"

  android_12:
    image: "assets/app_logo.png"
    icon_background_color: "#FFFFFF"
    image_dark: "assets/app_logo.png"
    icon_background_color_dark: "#0F172A"