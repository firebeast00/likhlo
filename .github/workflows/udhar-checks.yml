name: Udhar checks
on:
  push:
    branches:
      - codex/udhar-nlp-budget-sync
jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter test --no-pub test/udhar_input_service_test.dart test/udhar_ledger_integration_test.dart test/ledger_regression_test.dart
      - name: Check Dart errors
        run: |
          flutter analyze --no-pub lib test > analyze.log 2>&1 || true
          cat analyze.log
          if grep -Eq '^[[:space:]]*error[[:space:]]+[•-]' analyze.log; then exit 1; fi
