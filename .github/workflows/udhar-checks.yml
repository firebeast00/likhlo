name: Udhar checks
on:
  push:
    branches:
      - codex/udhar-nlp-budget-sync
jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: updated
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter test --no-pub
