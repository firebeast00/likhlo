name: Voice diagnostics validation
on:
  push:
    branches: [codex/voice-diagnostics]
  pull_request:
    paths: ['lib/**', 'test/**', 'tool/**', 'pubspec*', '.github/workflows/voice-diagnostics.yml']
jobs:
  verify:
    concurrency:
      group: voice-diagnostics-tests-${{ github.head_ref || github.ref_name }}
      cancel-in-progress: true
    timeout-minutes: 15
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.8'
          channel: stable
          cache: true
      - run: python3 tool/generate_app_catalog.py --check
      - name: Verify timing preserves command execution behavior
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          baseline = '6f71e5208cda453253f97c73cb8a667aa4cf5f09'
          paths = [
              'lib/features/dashboard/dashboard_smart_input_widget.dart',
              'lib/features/dashboard/dashboard_smart_entry_transfer.dart',
              'lib/features/dashboard/dashboard_smart_entry_mutation.dart',
              'lib/features/dashboard/dashboard_smart_entry_queries.dart',
              'lib/features/dashboard/dashboard_smart_entry_matching.dart',
              'lib/features/smart_entry/', 'lib/providers/',
              ':(exclude)lib/providers/settings_provider.dart',
              ':(exclude)lib/features/smart_entry/smart_entry_controller.dart',
              'lib/services/confidence_evaluator.dart',
              'lib/services/transaction_executor.dart',
              'lib/services/udhar_input_service.dart',
              'lib/services/speech_command_completeness.dart',
              'lib/services/speech_session_controller.dart',
          ]
          subprocess.run(['git', 'diff', '--exit-code', baseline, 'HEAD', '--', *paths], check=True)
          # The unified language setting is explicitly in scope; all other
          # settings and their load/default behavior must remain unchanged.
          path = 'lib/providers/settings_provider.dart'
          previous = subprocess.check_output(['git', 'show', f'{baseline}:{path}'], text=True)
          current = Path(path).read_text()
          start = '  Future<void> updateSmartEntryLanguage('
          end = '  void updateBrightness('
          assert current[:current.index('  /// One selection')] == previous[:previous.index(start)], 'Unrelated settings initialization changed'
          assert current[current.index(end):] == previous[previous.index(end):], 'Unrelated settings behavior changed'
          path = 'lib/screens/debt_screen.dart'
          previous = subprocess.check_output(['git', 'show', f'{baseline}:{path}'], text=True)
          current = Path(path).read_text()
          marker = '  Future<void> _processNLP('
          assert current[current.index(marker):].rstrip() == previous[previous.index(marker):].rstrip(), 'Udhaar processing, ledger or UI behavior changed'
          print('Other command handlers, confidence, ledger validators and entry controls are unchanged')
          PY
          python3 tool/check_home_category_scope.py
      - id: dependencies
        run: flutter pub get
      - name: Format diagnostics and voice timing files
        run: dart format lib/services/voice_diagnostics_service.dart lib/services/voice_diagnostic_observer.dart lib/screens/voice_diagnostics_screen.dart lib/services/speech_timing_policy.dart test/voice_diagnostics*_test.dart test/speech_timing_policy_test.dart test/audio_feedback_service_test.dart lib/services/explicit_expense_category.dart test/explicit_expense_category_test.dart
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Focused diagnostics, voice timing and language settings tests
        run: flutter test --timeout 1m test/voice_diagnostics_service_test.dart test/voice_diagnostics_observer_test.dart test/voice_diagnostics_screen_test.dart test/voice_diagnostics_backup_test.dart test/speech_timing_policy_test.dart test/audio_feedback_service_test.dart test/app_language_test.dart test/explicit_expense_category_test.dart
      - if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        name: Compare full suite with current app baseline
        shell: bash
        run: |
          git worktree add --detach "$RUNNER_TEMP/diagnostics-baseline" 3ba06f0bccb5e9a9eeadaa96b7029bdf95b63c4f
          cd "$RUNNER_TEMP/diagnostics-baseline"
          flutter pub get
          set +e
          flutter test --timeout 1m --reporter json > "$RUNNER_TEMP/baseline-tests.json"
          baseline_status=$?
          dart run tool/semantic_benchmark.dart > "$RUNNER_TEMP/baseline-benchmark.txt"
          baseline_benchmark_status=$?
          cd "$GITHUB_WORKSPACE"
          flutter test --timeout 1m --reporter json > "$RUNNER_TEMP/head-tests.json"
          head_status=$?
          dart run tool/semantic_benchmark.dart > "$RUNNER_TEMP/head-benchmark.txt"
          head_benchmark_status=$?
          set -e
          echo "Full suite exit codes: baseline=$baseline_status head=$head_status"
          echo "Parser benchmark exit codes: baseline=$baseline_benchmark_status head=$head_benchmark_status"
          python3 -c 'from pathlib import Path; import sys; a,b=[Path(p).read_text() for p in sys.argv[1:]]; assert "Samples:" in a and "Samples:" in b, "Parser benchmark did not run"; new={x for x in b.splitlines() if x.startswith("- ")}-{x for x in a.splitlines() if x.startswith("- ")}; assert not new, str(new); print("No new parser benchmark failures")' "$RUNNER_TEMP/baseline-benchmark.txt" "$RUNNER_TEMP/head-benchmark.txt"
          python3 tool/compare_flutter_tests.py "$RUNNER_TEMP/baseline-tests.json" "$RUNNER_TEMP/head-tests.json"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-validation
          path: |
            ${{ runner.temp }}/*-tests.json
            pubspec.lock
            lib/services/voice_diagnostics_service.dart
            lib/screens/voice_diagnostics_screen.dart
            test/voice_diagnostics*_test.dart
            lib/services/speech_timing_policy.dart
            test/speech_timing_policy_test.dart
  android:
    concurrency:
      group: voice-diagnostics-apk-${{ github.head_ref || github.ref_name }}
      cancel-in-progress: false
    timeout-minutes: 25
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: app_changes
        name: Check whether app inputs changed
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import os, subprocess
          paths = subprocess.check_output(['git', 'diff', '--name-only', 'HEAD^', 'HEAD'], text=True).splitlines()
          changed = any(p.startswith(('lib/', 'android/', 'ios/', 'assets/')) or p in ('pubspec.yaml', 'pubspec.lock') for p in paths)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"changed={str(changed).lower()}\n")
          print('App inputs changed:', changed)
          PYCODE
      - if: steps.app_changes.outputs.changed == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - if: steps.app_changes.outputs.changed == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.8'
          channel: stable
          cache: true
      - if: steps.app_changes.outputs.changed == 'true'
        run: flutter pub get
      - if: steps.app_changes.outputs.changed == 'true'
        name: Build teammate test APK
        run: flutter build apk --debug --dart-define=BUILD_COMMIT=${{ github.sha }}
      - if: steps.app_changes.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: likhlo-voice-diagnostics-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

