name: Voice diagnostics validation
on:
  push:
    branches: [codex/voice-diagnostics]
  pull_request:
    paths: ['lib/**', 'test/**', 'tool/**', 'pubspec*', '.github/workflows/voice-diagnostics.yml']
concurrency:
  group: diagnostics-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  verify:
    timeout-minutes: 15
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.8'
          channel: stable
          cache: true
      - run: python3 tool/generate_app_catalog.py --check
      - id: dependencies
        run: flutter pub get
      - name: Format new diagnostics files
        run: dart format lib/services/voice_diagnostics_service.dart lib/screens/voice_diagnostics_screen.dart test/voice_diagnostics*_test.dart
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Focused diagnostics tests
        run: flutter test test/voice_diagnostics_service_test.dart test/voice_diagnostics_screen_test.dart
      - if: ${{ always() && steps.dependencies.outcome == 'success' }}
        name: Compare full suite with current app baseline
        shell: bash
        run: |
          git worktree add --detach "$RUNNER_TEMP/diagnostics-baseline" 3ba06f0bccb5e9a9eeadaa96b7029bdf95b63c4f
          cd "$RUNNER_TEMP/diagnostics-baseline"
          flutter pub get
          set +e
          flutter test --reporter json > "$RUNNER_TEMP/baseline-tests.json"
          baseline_status=$?
          cd "$GITHUB_WORKSPACE"
          flutter test --reporter json > "$RUNNER_TEMP/head-tests.json"
          head_status=$?
          set -e
          echo "Full suite exit codes: baseline=$baseline_status head=$head_status"
          python3 tool/compare_flutter_tests.py "$RUNNER_TEMP/baseline-tests.json" "$RUNNER_TEMP/head-tests.json"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-validation
          path: |
            ${{ runner.temp }}/*-tests.json
            pubspec.lock
            lib/services/voice_diagnostics_service.dart
            lib/screens/voice_diagnostics_screen.dart
            test/voice_diagnostics*_test.dart
  android:
    timeout-minutes: 25
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.8'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build teammate test APK
        run: flutter build apk --debug --dart-define=BUILD_COMMIT=${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: likhlo-voice-diagnostics-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
