name: Language and ledger regression
on:
  push:
    branches: [codex/english-roman-urdu]
  pull_request:
    paths: ['lib/**', 'test/**', 'tool/generate_app_catalog.py', '.github/workflows/language-regression.yml']
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: python3 tool/generate_app_catalog.py --check
      - id: dependencies
        run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - if: ${{ always() && steps.dependencies.outcome == 'success' }}
        run: flutter test
